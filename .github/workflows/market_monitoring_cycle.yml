name: ProfitForge Automated Market Cycle

on:
  schedule:
    # Executes every 15 minutes to align with the lowest timeframe
    - cron: "*/15 * * * *" 
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security_audit:
    name: Static Analysis & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.0.0 bandit==1.7.7

      - name: Linting (Syntax & Readability)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: OWASP Vulnerability Scan (Bandit)
        run: |
          bandit -r . -ll -ii -c "bandit.yml" || echo "Bandit scan completed."

  execution_and_state_sync:
    name: Signal Pipeline & DB Sync
    needs: security_audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Ingest Market Data
        env:
          XT_API_BASE_URL: ${{ secrets.XT_API_BASE_URL }}
        run: python data_ingestion.py

      - name: Step 2 - Calculate Multi-Timeframe Consensus
        run: python consensus_engine.py

      - name: Step 3 - Bridge Rich Signals to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_bridge.py

      - name: Step 4 - Preserve State (Database Sync)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add signals.db
          # Check if there are changes to commit to prevent workflow failures
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated database update [skip ci]" && git push)
